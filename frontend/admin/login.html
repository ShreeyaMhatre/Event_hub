<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login</title><link rel="stylesheet" href="css/style.css"></head><body><main style="min-height:100vh;display:grid;place-items:center"><div class="form" style="width:400px"><h1>Event Admin</h1><input id="u" placeholder="Username" value="admin"><input id="p" type="password" placeholder="Password" value="admin123" style="width:100%;padding:10px;margin:10px 0"><button class="btn primary" onclick="login()">Login</button><p id="m"></p></div></main><script>async function login(){let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:u.value,password:p.value})}),d=await r.json();if(!r.ok)m.textContent=d.detail;else{localStorage.setItem('admin_key',d.admin_key);location='dashboard.html'}}</script></body></html>
