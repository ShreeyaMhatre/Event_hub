<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR Scanner</title><link rel="stylesheet" href="css/style.css"><script src="https://unpkg.com/html5-qrcode"></script></head><body><div class="dashboard"><aside class="sidebar"><h2>Event Admin</h2><a href="dashboard.html">Dashboard</a><a href="events.html">Events</a><a href="registrations.html">Registrations</a><a href="attendance.html">Attendance</a><a href="scanner.html">QR Scanner</a></aside><main class="main-content"><h1>QR Entry Scanner</h1><div class="scanner"><label>Scanner key</label><input id="key" value="gate-a-dev-key" style="width:100%;padding:10px;margin:10px 0"><div id="reader"></div><div id="out" class="result">Waiting for QR...</div></div></main></div><script>let busy=false;async function scan(t){if(busy)return;busy=true;out.textContent='Verifying...';try{let r=await fetch('/api/verify',{method:'POST',headers:{'Content-Type':'application/json','X-Scanner-Key':key.value},body:JSON.stringify({token:t})}),d=await r.json();out.className='result '+(d.ok?'ok':'bad');out.innerHTML='<b>'+(d.ok?'✓ ENTRY APPROVED':'✕ ENTRY DENIED')+'</b><br>'+d.message+'<br>'+ (d.holder_name||'')}catch(e){out.className='result bad';out.textContent=e.message}setTimeout(()=>busy=false,2500)}new Html5QrcodeScanner('reader',{fps:10,qrbox:250},false).render(scan,()=>{});</script></body></html>
