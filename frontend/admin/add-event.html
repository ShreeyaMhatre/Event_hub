<!doctype html><html><head><meta charset="utf-8"><title>Add Event</title><link rel="stylesheet" href="css/style.css"></head><body><div class="dashboard"><aside class="sidebar"><h2>Event Admin</h2><a href="dashboard.html">Dashboard</a><a href="events.html">Events</a><a href="registrations.html">Registrations</a><a href="attendance.html">Attendance</a><a href="scanner.html">QR Scanner</a></aside><main class="main-content"><div class="form"><h1>Event</h1><div class="field"><label>Name</label><input id="n"></div><div class="field"><label>Category</label><select id="cat"><option>TECHNOLOGY</option><option>CULTURAL</option><option>SPORTS</option><option>GENERAL</option></select></div><div class="field"><label>Date label</label><input id="date"></div><div class="field"><label>Venue</label><input id="v"></div><div class="field"><label>Starts</label><input id="s" type="datetime-local"></div><div class="field"><label>Ends</label><input id="e" type="datetime-local"></div><div class="field"><label>Fee ₹</label><input id="fee" type="number" value="0"></div><div class="field"><label>Capacity</label><input id="cap" type="number" value="500"></div><div class="field"><label>Description</label><textarea id="desc"></textarea></div><div class="field"><label>Image path</label><input id="im" value="images/tech-fest.jpeg"></div><button class="btn primary" onclick="save()">Save</button><p id="m"></p></div></main></div><script src="js/admin.js"></script><script>let id=new URLSearchParams(location.search).get('id');async function init(){if(!id)return;let x=(await A.r('/api/admin/events')).find(e=>e.id==id);n.value=x.name;cat.value=x.category;date.value=x.event_date;v.value=x.venue;s.value=x.starts_at.slice(0,16);e.value=x.ends_at.slice(0,16);fee.value=x.fee;cap.value=x.capacity;desc.value=x.description;im.value=x.image}async function save(){let x={name:n.value,category:cat.value,description:desc.value,event_date:date.value,venue:v.value,starts_at:new Date(s.value).toISOString(),ends_at:new Date(e.value).toISOString(),fee:+fee.value,capacity:+cap.value,image:im.value};try{await A.r(id?'/api/admin/events/'+id:'/api/admin/events',{method:id?'PUT':'POST',body:JSON.stringify(x)});location='events.html'}catch(z){m.textContent=z.message}}init()</script></body></html>
